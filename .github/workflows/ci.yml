name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: UNIVERSAL=1 scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LyricBar-macos
          path: dist/LyricBar-macos.zip
