name: Release

# Push a tag like v0.2.0 to publish a GitHub Release with:
#   LyricBar.dmg, LyricBar-macos.zip (macOS app) and LyricBar-extension.zip
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: UNIVERSAL=1 scripts/build-macos.sh
      - run: scripts/package-extension.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/LyricBar.dmg dist/LyricBar-macos.zip dist/LyricBar-extension.zip \
            --title "LyricBar $GITHUB_REF_NAME" --generate-notes
